name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  release:
    needs: [build-manager]
    runs-on: ubuntu-latest
    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Show artifacts
        run: |
          echo "===== artifacts/ ====="
          find artifacts -maxdepth 3 -type f -printf '%p  (%s bytes)\n' | sort || true

      - name: Rename ksud
        run: |
          mkdir -p ksud
          find artifacts -type f -name 'ksud' -path '*/release/*' | while read -r f; do
            # f = artifacts/ksud-<target>/target/<target>/release/ksud
            artifact=$(echo "$f" | awk -F/ '{for (i=1;i<=NF;i++) if ($i=="artifacts") {print $(i+1); exit}}')
            mv "$f" "ksud/${artifact}"
          done
          echo "===== ksud/ ====="
          ls -la ksud || true

      - name: Rename LKM artifacts
        run: |
          find artifacts -type f -name '*_kernelsu.ko' | while read -r f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            archdir=$(basename "$dir")     # e.g. aarch64-android14-6.1-lkm
            arch=${archdir%%-*}            # → aarch64
            mv "$f" "$dir/${arch}_${base}"
          done
          echo "===== .ko files ====="
          find artifacts -type f -name '*_kernelsu.ko' -printf '%p\n' | sort || true

      - name: Zip AnyKernel3
        run: |
          shopt -s nullglob
          for dir in artifacts/AnyKernel3-*; do
            [ -d "$dir" ] || continue
            echo "----- Zip $dir -----"
            ( cd "$dir" && zip -r9 "$(basename "$dir")".zip ./* -x .git .gitignore ./*.zip )
          done

      - name: Zip WSA kernel
        run: |
          shopt -s nullglob
          for dir in artifacts/kernel-WSA-*; do
            [ -d "$dir" ] || continue
            echo "------ Zip $dir ----------"
            ( cd "$dir" && zip -r9 "$(basename "$dir")".zip ./* -x .git .gitignore ./*.zip )
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          shopt -s nullglob
          for dir in artifacts/kernel-ARCVM-*; do
            [ -d "$dir" ] || continue
            echo "------ Zip $dir ----------"
            ( cd "$dir" && zip -r9 "$(basename "$dir")".zip ./* -x .git .gitignore ./*.zip )
          done

      - name: Display structure for release
        run: |
          echo "===== staging ====="
          find artifacts ksud -maxdepth 3 -type f -printf '%p  (%s bytes)\n' 2>/dev/null | sort || true


      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.apk
            artifacts/**/*.ko
            artifacts/**/*.zip
            artifacts/**/*.img.gz
            ksud/*
